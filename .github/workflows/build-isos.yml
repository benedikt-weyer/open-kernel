name: Build ISOs

on:
  push:
    branches: [main]

concurrency:
  group: build-isos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-tags:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      final_tag: ${{ steps.release.outputs.final_tag }}
      final_commit: ${{ steps.release.outputs.final_commit }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        run: node scripts/release-tags.mts

  build-isos:
    needs: release-tags
    if: needs.release-tags.outputs.final_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout open-kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tags.outputs.final_commit }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Download OpenKernel toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=open-kernel-stage1-x86_64-unknown-linux-gnu.tar.gz
          toolchain="$RUNNER_TEMP/open-kernel-toolchain"
          mkdir -p "$toolchain"
          gh release download --repo benedikt-weyer/rust-open-kernel --pattern "$archive" --pattern "$archive.sha256" --dir "$toolchain"
          (cd "$toolchain" && sha256sum --check "$archive.sha256")
          tar -xzf "$toolchain/$archive" -C "$toolchain"
          echo "OPENKERNEL_RUSTC=$toolchain/stage1/bin/rustc" >> "$GITHUB_ENV"

      - name: Build GRUB ISO
        run: nix develop --command scripts/build-iso

      - name: Build Limine ISO
        run: nix develop --command scripts/build-limine-iso

      - name: Release boot images
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-tags.outputs.final_tag }}
          files: |
            build/open-kernel.iso
            build/open-kernel-limine.iso
            build/open-kernel.elf
            build/open-kernel-limine.elf
